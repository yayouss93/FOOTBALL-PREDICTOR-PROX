<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Predictor Pro</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #101e30;
      --green: #19d38b;
      --text: #f2f6fc;
      --muted: #a4b2c5;
      --border: #26364b;
    }
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 20px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
.container {
  max-width: 900px;
  margin: auto;
}
header {
  text-align: center;
  padding: 25px 10px;
}
h1 {
  color: var(--green);
  margin-bottom: 8px;
}
.subtitle {
  color: var(--muted);
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 18px;
}
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
input, button {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  border: 1px solid var(--border);
  font-size: 15px;
}
input {
  background: #07111f;
  color: var(--text);
  min-width: 0;
}
button {
  background: var(--green);
  color: #04150e;
  border: none;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  opacity: 0.6;
  cursor: wait;
}
.status {
  color: var(--muted);
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.match {
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}
.match:last-child {
  border-bottom: none;
}
.teams {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 8px;
}
.meta {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}
.empty {
  text-align: center;
  padding: 25px 8px;
  color: var(--muted);
}
.error {
  color: #ff8f8f;
}
.tag {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  background: #123c30;
  color: var(--green);
  font-size: 12px;
  margin-bottom: 8px;
}
@media (max-width: 560px) {
  body {
    padding: 12px;
  }
  .controls {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="tag">FOOTBALL • ANALYSE</div>
      <h1>⚽ Football Predictor Pro</h1>
      <p class="subtitle">
        Consulte les rencontres de football par date.
      </p>
    </header>
<section class="panel">
  <h2>État du service</h2>
  <div id="status" class="status">Vérification du serveur...</div>
</section>
<section class="panel">
  <h2>Rechercher les matchs</h2>
  <div class="controls">
    <input id="date" type="date" aria-label="Date des matchs">
    <button id="refresh" type="button">Actualiser les matchs</button>
    <input
      id="search"
      type="search"
      placeholder="Rechercher une équipe ou une ligue..."
      aria-label="Rechercher une équipe ou une ligue"
    >
  </div>
</section>
<section class="panel">
  <h2>Rencontres</h2>
  <div id="diagnostics" class="status">
    En attente des données...
  </div>
  <div id="matches"></div>
</section>
  </div>
  <script>
    const statusEl = document.getElementById("status");
    const dateEl = document.getElementById("date");
    const searchEl = document.getElementById("search");
    const refreshBtn = document.getElementById("refresh");
    const matchesEl = document.getElementById("matches");
    const diagnosticsEl = document.getElementById("diagnostics");
    let allFixtures = [];
    function localDateString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }
    function safeText(value) {
      return String(value ?? "");
    }
    function formatDate(value) {
      if (!value) return "Horaire non disponible";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "Horaire non disponible";
      }
      return date.toLocaleString("fr-FR", {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }
    async function checkHealth() {
      try {
        const response = await fetch("/api/health");
        const data = await response.json();
        if (!response.ok) {
          throw new Error("Le serveur a répondu avec une erreur.");
        }
        statusEl.textContent =
          `Serveur : ${data.status} | ` +
          `Clé API configurée : ${data.apiKeyConfigured ? "Oui" : "Non"} | ` +
          `Fuseau horaire : ${data.timezone || "non précisé"}`;
        if (!data.apiKeyConfigured) {
          statusEl.classList.add("error");
        } else {
          statusEl.classList.remove("error");
        }
      } catch (error) {
        statusEl.textContent =
          "Impossible de vérifier le serveur. Vérifie l'hébergement.";
        statusEl.classList.add("error");
      }
    }
    function renderMatches() {
      const query = searchEl.value.trim().toLowerCase();
      const filtered = allFixtures.filter((item) => {
        const home = safeText(item.teams?.home?.name).toLowerCase();
        const away = safeText(item.teams?.away?.name).toLowerCase();
        const league = safeText(item.league?.name).toLowerCase();
        return (
          home.includes(query) ||
          away.includes(query) ||
          league.includes(query)
        );
      });
      matchesEl.replaceChildren();
      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = allFixtures.length === 0
          ? "Aucun match reçu pour cette date. Consulte les diagnostics ci-dessus."
          : "Aucun match ne correspond à ta recherche.";
        matchesEl.appendChild(empty);
        return;
      }
      for (const item of filtered) {
        const match = document.createElement("article");
        match.className = "match";
        const teams = document.createElement("div");
        teams.className = "teams";
        teams.textContent =
          `${safeText(item.teams?.home?.name)} vs ` +
          `${safeText(item.teams?.away?.name)}`;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent =
          `${safeText(item.league?.name)} · ` +
          `${formatDate(item.fixture?.date)} · ` +
          `Statut : ${safeText(item.fixture?.status?.short || "N/A")}`;
        match.append(teams, meta);
        matchesEl.appendChild(match);
      }
    }
    async function loadMatches() {
      const date = dateEl.value;
      if (!date) {
        diagnosticsEl.textContent = "Choisis une date valide.";
        return;
      }
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Chargement...";
      diagnosticsEl.classList.remove("error");
      diagnosticsEl.textContent = "Récupération des matchs...";
      matchesEl.replaceChildren();
      try {
        const response = await fetch(
          `/api/fixtures?date=${encodeURIComponent(date)}`
        );
        const data = await response.json();
        if (!response.ok) {
          throw new Error(
            JSON.stringify(data, null, 2)
          );
        }
        allFixtures = Array.isArray(data.fixtures)
          ? data.fixtures
          : [];
        diagnosticsEl.textContent =
          `Date demandée : ${data.date || date}\n` +
          `Fuseau horaire : ${data.timezone || "non précisé"}\n` +
          `Nombre de matchs : ${data.results ?? allFixtures.length}\n` +
          `Paramètres API : ${JSON.stringify(data.parameters || {})}\n` +
          `Erreurs API : ${JSON.stringify(data.errors || {})}\n` +
          `${data.message || ""}`;
        diagnosticsEl.style.whiteSpace = "pre-wrap";
        renderMatches();
      } catch (error) {
        allFixtures = [];
        diagnosticsEl.classList.add("error");
        diagnosticsEl.style.whiteSpace = "pre-wrap";
        diagnosticsEl.textContent =
          "Erreur lors du chargement des matchs.\n" +
          safeText(error.message);
        renderMatches();
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Actualiser les matchs";
      }
    }
    refreshBtn.addEventListener("click", loadMatches);
    searchEl.addEventListener("input", renderMatches);
    dateEl.addEventListener("change", loadMatches);
    dateEl.value = localDateString();
    checkHealth();
    loadMatches();
  </script>
</body>
</html>
